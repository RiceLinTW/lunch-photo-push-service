<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f26b38">
  <meta name="description" content="學校午餐照片上傳時，立即收到通知。">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <meta name="apple-mobile-web-app-title" content="國小午餐通知">
  <link rel="stylesheet" href="styles.css?v=4">
  <title>午餐好了沒？</title>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">SCHOOL LUNCH</span>
      <h1>午餐好了沒？</h1>
      <p>搜尋你的學校，菜色照片一上傳就通知你。</p>
      <p><a href="install.html">第一次使用？看安裝教學 →</a></p>
    </header>

    <p id="install-hint" class="hint install-banner" hidden>📱 iPhone 請先點瀏覽器的「分享」按鈕 → 加入主畫面，再從主畫面開啟本頁後才選學校——先在瀏覽器分頁裡選好學校，加入主畫面後會讀不到，需要重選。</p>

    <section class="card" aria-labelledby="school-heading">
      <h2 id="school-heading">選擇學校</h2>
      <p id="selected-school" class="hint" hidden></p>
      <button id="change-school" class="secondary" type="button" hidden>重新選擇學校</button>
      <div id="school-search">
        <label for="school-query">學校名稱</label>
        <input id="school-query" autocomplete="off" placeholder="輸入學校名稱，例如：大安">
        <div id="school-results" class="school-results" aria-live="polite"></div>
        <p id="directory-status" class="hint"></p>
      </div>
      <div class="actions">
        <button id="install-app" class="secondary" type="button" hidden>加入主畫面</button>
        <button id="subscribe" class="primary" type="button" disabled>開啟照片通知</button>
        <button id="unsubscribe" class="secondary" type="button">取消通知</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="menu-section" class="card" aria-labelledby="menu-heading" hidden>
      <div class="section-title">
        <h2 id="menu-heading">菜色</h2>
        <input type="date" id="menu-date" aria-label="查詢日期">
      </div>
      <div id="menu" class="menu-grid"></div>
    </section>
  </main>
  <footer>
    <a href="install.html">怎麼安裝</a>
    <span aria-hidden="true">·</span>
    <a href="privacy.html">隱私權政策</a>
    <span aria-hidden="true">·</span>
    <a href="https://buymeacoffee.com/rice.lin" target="_blank" rel="noreferrer">☕ Buy me a coffee</a>
    <p id="build-tag" class="hint"></p>
  </footer>
  <script src="config.js?v=4"></script>
  <script src="app.js?v=4" type="module"></script>
</body>
</html>
