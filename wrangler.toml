name = "lunch-photo-push-service"
main = "src/index.ts"
compatibility_date = "2026-09-04"

[[d1_databases]]
binding = "DB"
database_name = "lunch-photo-push-service"
# Replace this placeholder with the ID returned by:
#   wrangler d1 create lunch-photo-push-service
database_id = "00000000-0000-0000-0000-000000000000"

[triggers]
crons = ["0 0-6 * * *"]

[vars]
FRONTEND_URL = "https://example.github.io/lunch-photo-push-service/"
