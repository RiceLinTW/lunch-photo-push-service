name: Trigger menu check

on:
  # cron-job.org is the real scheduler now (more reliable than GitHub's, and
  # running both doubled up requests to the source site). Kept as a manual
  # trigger only, for testing.
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Worker cron endpoint
        run: |
          curl -sf "https://lunch-photo-push-service.fzgxt5k8ff.workers.dev/api/debug/where-apac" \
            -H "x-debug-token: ${{ secrets.TEMP_DEBUG_TOKEN }}"
