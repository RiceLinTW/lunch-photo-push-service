name: Trigger menu check

on:
  # Cloudflare's own native Cron Trigger is the real scheduler now (see
  # wrangler.toml [triggers]) - it doesn't carry the "known automation IP"
  # reputation that made the source challenge every request triggered from
  # here or from cron-job.org, even with the outbound fetch pinned to a
  # working APAC colo. Kept as a manual trigger only, for testing.
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Worker cron endpoint
        run: |
          curl -sf -X POST "https://lunch-photo-push-service.fzgxt5k8ff.workers.dev/api/cron/trigger" \
            -H "x-cron-token: ${{ secrets.CRON_TRIGGER_TOKEN }}"
